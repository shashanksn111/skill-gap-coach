services:
  - type: web
    name: skill-gap-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste it during setup; never committed
      - key: PYTHON_VERSION
        value: 3.12.8
